<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바이브 펫 호텔 예약서</title>
    <!-- Google Fonts - Spotify CircularSp 대체 폰트 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- 외부 스타일시트 연결 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <!-- ===== 페이지 상단 헤더 ===== -->
        <header class="header">
            <div class="logo">🐾</div>
            <h1>바이브 펫 호텔</h1>
            <p class="subtitle">우리 아이의 특별한 하루를 맡겨주세요</p>
        </header>

        <!-- ===== 예약서 폼 ===== -->
        <form id="reservationForm">

            <!-- 1. 보호자 이름 (필수) -->
            <div class="form-group">
                <label for="ownerName">보호자 이름 <span class="required">*</span></label>
                <input type="text" id="ownerName" placeholder="이름을 입력해주세요" required>
            </div>

            <!-- 2. 연락처 -->
            <div class="form-group">
                <label for="phone">연락처</label>
                <input type="tel" id="phone" placeholder="010-0000-0000">
            </div>

            <!-- 3. 반려동물 이름 (필수) -->
            <div class="form-group">
                <label for="petName">반려동물 이름 <span class="required">*</span></label>
                <input type="text" id="petName" placeholder="반려동물 이름을 입력해주세요" required>
            </div>

            <!-- 4. 반려동물 종류 (드롭다운) -->
            <div class="form-group">
                <label for="petType">반려동물 종류 <span class="required">*</span></label>
                <select id="petType">
                    <option value="">-- 선택해주세요 --</option>
                    <option value="30000">소형견 (10kg 미만) — 1박 30,000원</option>
                    <option value="40000">중형견 (10~25kg) — 1박 40,000원</option>
                    <option value="50000">대형견 (25kg 이상) — 1박 50,000원</option>
                    <option value="25000">고양이 — 1박 25,000원</option>
                    <option value="20000">기타 소동물 — 1박 20,000원</option>
                </select>
            </div>

            <!-- 5. 객실 등급 (라디오 버튼, 가로 배치) -->
            <div class="form-group">
                <label>객실 등급</label>
                <div class="radio-group">
                    <label class="chip-label" for="gradeStandard">
                        <input type="radio" name="roomGrade" id="gradeStandard" value="0" checked>
                        <span class="chip">스탠다드 (+0원)</span>
                    </label>
                    <label class="chip-label" for="gradeDeluxe">
                        <input type="radio" name="roomGrade" id="gradeDeluxe" value="15000">
                        <span class="chip">디럭스 (+15,000원)</span>
                    </label>
                    <label class="chip-label" for="gradeSuite">
                        <input type="radio" name="roomGrade" id="gradeSuite" value="30000">
                        <span class="chip">스위트 (+30,000원)</span>
                    </label>
                </div>
            </div>

            <!-- 6. 추가 서비스 (체크박스, 가로 배치) -->
            <div class="form-group">
                <label>추가 서비스</label>
                <div class="checkbox-group">
                    <label class="chip-label" for="svcBath">
                        <input type="checkbox" name="service" id="svcBath" value="20000" data-name="목욕 서비스">
                        <span class="chip">🛁 목욕 (+20,000원)</span>
                    </label>
                    <label class="chip-label" for="svcGrooming">
                        <input type="checkbox" name="service" id="svcGrooming" value="30000" data-name="미용 서비스">
                        <span class="chip">✂️ 미용 (+30,000원)</span>
                    </label>
                    <label class="chip-label" for="svcWalk">
                        <input type="checkbox" name="service" id="svcWalk" value="10000" data-name="산책 서비스">
                        <span class="chip">🦮 산책 (+10,000원)</span>
                    </label>
                    <label class="chip-label" for="svcSnack">
                        <input type="checkbox" name="service" id="svcSnack" value="5000" data-name="간식 패키지">
                        <span class="chip">🦴 간식 (+5,000원)</span>
                    </label>
                </div>
            </div>

            <!-- 7~8. 체크인 / 체크아웃 날짜 -->
            <div class="form-group date-group">
                <div class="date-field">
                    <label for="checkIn">체크인 <span class="required">*</span></label>
                    <input type="date" id="checkIn">
                </div>
                <div class="date-field">
                    <label for="checkOut">체크아웃 <span class="required">*</span></label>
                    <input type="date" id="checkOut">
                </div>
            </div>

            <!-- 9. 숙박 일수 (자동 계산, 읽기 전용) -->
            <div class="form-group">
                <label for="nights">숙박 일수</label>
                <input type="text" id="nights" value="0박" readonly class="nights-display">
            </div>

            <!-- 10. 특이사항 / 요청사항 -->
            <div class="form-group">
                <label for="request">특이사항 / 요청사항</label>
                <textarea id="request" rows="4" placeholder="알레르기, 복용 중인 약, 특이사항 등을 적어주세요"></textarea>
            </div>

            <!-- 예상 금액 표시 영역 -->
            <div class="estimated-price" id="estimatedPrice">
                <span class="price-label">예상 금액</span>
                <span class="price-value" id="priceValue">0원</span>
            </div>

            <!-- 버튼 영역 -->
            <div class="button-group">
                <button type="button" id="submitBtn" class="btn btn-primary">예약하기</button>
                <button type="button" id="excelBtn" class="btn btn-excel">엑셀 저장</button>
                <button type="button" id="resetBtn" class="btn btn-outlined">다시 작성</button>
            </div>
        </form>

        <!-- 예약 확인 메시지 영역 -->
        <div id="confirmMessage" class="confirm-message" style="display: none;"></div>

        <!-- 저장된 예약 건수 표시 -->
        <div id="reservationCount" class="reservation-count"></div>

    </div>

    <!-- SheetJS 라이브러리 (엑셀 파일 생성용) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- 메인 자바스크립트 연결 -->
    <script src="main.js"></script>
</body>
</html>
